[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "erpera_driver_app"
authors = [
    { name = "Reformiqo", email = "consultant.reformiqo@gmail.com" }
]
description = "Erpera Driver App ERP"
readme = "README.md"
requires-python = ">=3.10"
version = "0.0.1"
# No runtime dependencies of its own — the bench supplies frappe and erpnext.
# Build tooling (setuptools/wheel) is deliberately not pinned here: a pin in an
# app's dependencies is imposed on every bench that installs it, and forcing a
# downgrade of setuptools mid-build breaks the build environment. Pin it in the
# bench's own venv if a bench needs it.
dependencies = []

[project.urls]
Homepage = "https://github.com/reformiqo/cowberry_driver_app_erp"
